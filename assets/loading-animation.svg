<svg width="1200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="1200" height="200" fill="url(#bgGradient)"/>
  
  <!-- Wireframe Grid Lines (Three.js style) -->
  <g opacity="0.15" stroke="#00D9FF" stroke-width="1" fill="none">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
    <line x1="1000" y1="0" x2="1000" y2="200"/>
  </g>

  <!-- Rotating 3D Wireframe Cube (Left) -->
  <g transform="translate(150, 100)">
    <g opacity="0.8" stroke="#00D9FF" stroke-width="2" fill="none">
      <rect x="-30" y="-30" width="60" height="60">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="-25" y="-25" width="50" height="50">
        <animateTransform attributeName="transform" type="rotate" from="45 0 0" to="405 0 0" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Counter Display (0-100) with opacity animation -->
  <g transform="translate(600, 90)">
    <!-- Number 0 -->
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)">
      0<animate attributeName="opacity" values="1;0" dur="0.03s" begin="0s" fill="freeze"/>
    </text>
    <!-- Numbers 1-99 -->
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      1<animate attributeName="opacity" values="0;1;0" begin="0.03s" dur="0.03s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      5<animate attributeName="opacity" values="0;1;0" begin="0.15s" dur="0.15s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      10<animate attributeName="opacity" values="0;1;0" begin="0.3s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      15<animate attributeName="opacity" values="0;1;0" begin="0.45s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      20<animate attributeName="opacity" values="0;1;0" begin="0.75s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      25<animate attributeName="opacity" values="0;1;0" begin="1.05s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      30<animate attributeName="opacity" values="0;1;0" begin="1.35s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      35<animate attributeName="opacity" values="0;1;0" begin="1.65s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      40<animate attributeName="opacity" values="0;1;0" begin="1.95s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      45<animate attributeName="opacity" values="0;1;0" begin="2.25s" dur="0.3s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      50<animate attributeName="opacity" values="0;1;0" begin="2.55s" dur="0.15s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      55<animate attributeName="opacity" values="0;1;0" begin="2.70s" dur="0.1s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      60<animate attributeName="opacity" values="0;1;0" begin="2.80s" dur="0.05s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      65<animate attributeName="opacity" values="0;1;0" begin="2.85s" dur="0.05s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      70<animate attributeName="opacity" values="0;1;0" begin="2.90s" dur="0.03s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      75<animate attributeName="opacity" values="0;1;0" begin="2.93s" dur="0.02s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      80<animate attributeName="opacity" values="0;1;0" begin="2.95s" dur="0.02s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      85<animate attributeName="opacity" values="0;1;0" begin="2.97s" dur="0.01s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      90<animate attributeName="opacity" values="0;1;0" begin="2.98s" dur="0.01s" fill="freeze"/>
    </text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      95<animate attributeName="opacity" values="0;1;0" begin="2.99s" dur="0.01s" fill="freeze"/>
    </text>
    <!-- Final number: 100 -->
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#00D9FF" text-anchor="middle" filter="url(#glow)" opacity="0">
      100<animate attributeName="opacity" values="0;1" begin="3s" dur="0.1s" fill="freeze"/>
    </text>
    
    <!-- Percent symbol -->
    <text x="58" y="0" font-family="'Courier New', monospace" font-size="36" fill="#00D9FF" opacity="0.9">
      %
    </text>
    
    <!-- Progress bar - perfectly synced -->
    <g transform="translate(-250, 30)">
      <rect x="0" y="0" width="500" height="6" rx="3" fill="#1C2128"/>
      <rect x="0" y="0" width="0" height="6" rx="3" fill="#00D9FF" filter="url(#glow)">
        <animate attributeName="width" from="0" to="500" dur="3s" fill="freeze" calcMode="linear"/>
      </rect>
    </g>
    
    <!-- Loading text -->
    <text x="0" y="65" font-family="'Courier New', monospace" font-size="13" fill="#00D9FF" text-anchor="middle" opacity="0.7" letter-spacing="2">
      LOADING EXPERIENCE
    </text>
  </g>

  <!-- Rotating 3D Sphere wireframe (Right) -->
  <g transform="translate(1050, 100)">
    <g opacity="0.6" stroke="#00D9FF" stroke-width="1.5" fill="none">
      <circle cx="0" cy="0" r="35">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <ellipse cx="0" cy="0" rx="35" ry="15">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="0" rx="15" ry="35">
        <animateTransform attributeName="transform" type="rotate" from="90 0 0" to="450 0 0" dur="3s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- Particle points -->
  <g opacity="0.8" fill="#00D9FF">
    <circle cx="250" cy="40" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="160" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="50" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="150" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
